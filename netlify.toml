# A.I. Nonprofits on Netlify — same model as the other Thought Authorities sites:
# Netlify Functions (app), Netlify Database (accounts and data, provisioned from
# netlify/database/migrations on deploy) and Netlify Blobs (files and keys).
# The web app is static (dist/); the API is the `api` function; automations run in `jobs`.

[build]
  # Every deploy runs the test suite first; a failing test stops the deploy.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["server/db/migrations/**"]
  external_node_modules = ["pdfkit", "exceljs", "pg", "nodemailer", "@anthropic-ai/sdk"]

[functions.jobs]
  schedule = "* * * * *"

# Send API, webhook and email-tracking traffic to the function (original path preserved).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/webhooks/*"
  to = "/.netlify/functions/api/webhooks/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/t/*"
  to = "/.netlify/functions/api/t/:splat"
  status = 200
  force = true

# Single-page app: every other path loads the web app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
