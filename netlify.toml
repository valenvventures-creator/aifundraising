# A.I. Fundraising on Netlify — same model as the other Thought Authorities sites:
# Netlify Functions (app), Netlify Database (accounts and data, provisioned from
# netlify/database/migrations on deploy) and Netlify Blobs (files and keys).
# The web app is static (dist/); the API is the `api` function; automations run in `jobs`.

[build]
  # Every deploy runs the test suite first; a failing test stops the deploy.
  command = "npm test && npm run build && npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # Modern-format functions (routes and schedule are set in each function's `config`).
  # The server is precompiled into netlify/server-dist/app.mjs by `npm run build:netlify`.
  included_files = ["server/db/migrations/**", "netlify/server-dist/**", "node_modules/pdfkit/js/data/**"]

# Single-page app: every other path loads the web app. (/api, /webhooks and /t are
# matched by the `api` function first, so they never reach this rule.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
