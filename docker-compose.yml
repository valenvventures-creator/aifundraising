# Local / staging stack: Postgres + API (serves the built web app on :4000).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    volumes: [pgdata:/var/lib/postgresql/data, ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ainp:ainp@db:5432/ainp
      APP_URL: http://localhost:4000
      API_URL: http://localhost:4000
    ports: ["4000:4000"]
    volumes: [uploads:/app/storage]
    depends_on: [db]
volumes: { pgdata: {}, uploads: {} }
